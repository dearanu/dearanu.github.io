<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Surprise For You 💝</title>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- External Stylesheet -->
    <link rel="stylesheet" href="surprise.css">
</head>
<body>

<!-- Floating Background Elements -->
<div class="floating-hearts">
    <span>❤️</span>
    <span>💕</span>
    <span>💖</span>
    <span>💗</span>
    <span>💘</span>
    <span>💞</span>
</div>

<!-- Big Pulsing Heart Element -->
<div class="bg-heart"></div>

<!-- Main Display Card Container -->
<div class="surprise-card">

    <!-- 📸 Main Featured Photo (Home Page Style Frame) -->
    <div class="home-photo-card featured">
        <img src="surprise1.jpg" alt="Featured Moment">
    </div>

    <!-- 📸 3 Additional Photos in Home Page Card Format -->
    <div class="home-photo-gallery">
        <div class="home-photo-card">
            <img src="surprise2.jpg" alt="Memory 1">
        </div>
        <div class="home-photo-card">
            <img src="surprise3.jpg" alt="Memory 2">
        </div>
        <div class="home-photo-card">
            <img src="surprise4.jpg" alt="Memory 3">
        </div>
    </div>

    <h1>🎉 Happy Birthday,<br>My Love! 🎂</h1>
    <p>
        You deserve all the happiness in the world today and every day. 
        Thank you for being my smile, my peace, and my absolute favorite person. 
        I hope this little project brings a smile to your face! ❤️
    </p>
    
    <a href="home.html" id="backBtn" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i> Go Back
    </a>
</div>

<!-- External JavaScript -->
<script src="surprise.js"></script>
</body>
</html>
